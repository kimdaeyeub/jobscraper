<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobScraper — Find Jobs by Skill</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-glow" aria-hidden="true"></div>

    <div class="page">
      <header>
        <div class="badge">
          <span class="badge-dot"></span>
          40 Skills · Pre-scraped Data
        </div>
        <h1>Find jobs that match your <em>skills</em></h1>
      </header>

      <section class="search-card" aria-label="Skill search">
        <form class="search-form" id="search-form">
          <div class="select-wrap">
            <select id="skill-select" name="skill" required>
              <option value="">Select a skill</option>
            </select>
          </div>
          <button type="submit">Search</button>
        </form>

        <div class="quick-tags">
          <span>Browse skills</span>
          <div id="skill-tags" class="skill-tags"></div>
        </div>
      </section>

      <section id="results" aria-label="Search results" aria-live="polite"></section>

      <div class="sources">
        <span>Berlin Startup Jobs</span>
        <span>·</span>
        <span>We Work Remotely</span>
        <span>·</span>
        <span>Web3 Career</span>
      </div>

      <footer>JobScraper — Python Challenge</footer>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
